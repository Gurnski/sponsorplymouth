<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#b5125f">
  <title>Challenge leaders | Sponsor University of Plymouth</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/overpass.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-todo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4"/><path d="M6 5h11l-2.5 3.5L17 12H6"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l3 3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M11 7H6v11h11v-5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  </svg>

  <a class="skip" href="#main">Skip to the page</a>

  <header class="band">
    <div class="band-inner">
      <div class="band-id">
        <img src="/icon.svg" alt="" width="32" height="32">
        <div>
          <p class="band-title">Challenge leaders</p>
          <p class="band-name" id="me" hidden>Signed in as <strong id="me-name"></strong></p>
        </div>
      </div>
      <button class="button button-invert" id="sign-out" type="button" hidden>Sign out</button>
    </div>
  </header>

  <nav class="nav" id="nav" aria-label="Sections" hidden>
    <ul class="nav-list">
      <li><a href="#todo" data-view="todo"><svg class="icon" aria-hidden="true"><use href="#i-todo"/></svg><span class="nav-label">To do</span><span class="count" id="todo-count" hidden></span></a></li>
      <li><a href="#fundraisers" data-view="fundraisers"><svg class="icon" aria-hidden="true"><use href="#i-flag"/></svg><span class="nav-label">Fundraisers</span></a></li>
      <li><a href="#site" data-view="site"><svg class="icon" aria-hidden="true"><use href="#i-map"/></svg><span class="nav-label">Site</span></a></li>
      <li id="nav-logins" hidden><a href="#logins" data-view="logins"><svg class="icon" aria-hidden="true"><use href="#i-key"/></svg><span class="nav-label">Logins</span></a></li>
    </ul>
  </nav>

  <main id="main" tabindex="-1">
    <p class="load-note" id="loading" hidden>Loading…</p>

    <section class="sign-in" id="sign-in" aria-labelledby="sign-in-h" hidden>
      <h1 id="sign-in-h" tabindex="-1">Sign in</h1>
      <p class="lede">This page is for the challenge leaders. Use the password, or the leader key you were given.</p>
      <form id="login-form" class="panel">
        <label for="password">Password or leader key</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required aria-describedby="login-error">
        <label class="check" for="remember"><input id="remember" name="remember" type="checkbox"><span>Keep me signed in on this device</span></label>
        <p class="hint">Leave this unticked on a shared or library computer.</p>
        <p class="form-error" id="login-error" role="alert" hidden></p>
        <button class="button" id="login-button" type="submit">Sign in</button>
      </form>
    </section>

    <div id="view" hidden></div>

    <noscript><p class="lede">This page needs JavaScript switched on.</p></noscript>
  </main>

  <p class="visually-hidden" id="announce" role="status" aria-live="polite"></p>

  <script src="/admin.js" type="module"></script>
</body>
</html>
