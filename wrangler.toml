name = "donate-plymouth"
main = "src/worker.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "sponsorplymouth.co.uk", custom_domain = true },
  { pattern = "www.sponsorplymouth.co.uk", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/f/*"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "donate-plymouth"
database_id = "09724b4c-07a6-460e-929c-16961fc0c5f9"
