name = "donate-plymouth"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "donate-plymouth"
# Replace with the id printed by: npx wrangler d1 create donate-plymouth
database_id = "00000000-0000-0000-0000-000000000000"
